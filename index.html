<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cockpit-teste</title>
    <script>
      (function () {
        var KEY = 'figma-capture-session';
        if (location.hash.indexOf('figmacapture=') !== -1) {
          sessionStorage.setItem(KEY, location.hash.slice(1));
        }
        var params = location.hash.indexOf('figmacapture=') !== -1
          ? location.hash.slice(1)
          : sessionStorage.getItem(KEY);
        if (!params || params.indexOf('figmacapture=') === -1) return;
        if (location.hash.indexOf('figmacapture=') === -1) {
          location.hash = params;
        }
        var s = document.createElement('script');
        s.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
        s.async = true;
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
